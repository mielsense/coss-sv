version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    groups:
      svelte-tooling:
        patterns:
          - "svelte"
          - "@sveltejs/*"
          - "*svelte*"
          - "vite"
          - "vitest"
          - "@vitest/*"
      quality-tooling:
        dependency-type: development
        patterns:
          - "@biomejs/*"
          - "@playwright/*"
          - "playwright"
          - "prettier*"
          - "turbo"
          - "typescript"
    labels:
      - dependencies
    open-pull-requests-limit: 6

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
