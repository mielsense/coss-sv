name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=768

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out pinned COSS reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cosscom/coss
          ref: 19620ae8cae81e30775f2cde03829326cb4916b2
          path: reference
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check forbidden paths
        run: node scripts/check-forbidden-paths.mjs

      - name: Check license boundary
        run: node scripts/check-license-boundary.mjs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types and Svelte diagnostics
        run: pnpm check

      - name: Check parity inventory
        run: node scripts/parity/inventory.mts --require-complete

      - name: Check registry output
        run: pnpm registry:check

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Run tests
        run: pnpm test

      - name: Run component parity browser tests
        run: pnpm test:e2e

      - name: Build packages and documentation
        run: pnpm build

      - name: Check the published package surface
        run: pnpm --filter @coss-sv/ui pack:check

      - name: Smoke-test registry installation
        run: pnpm --filter @coss-sv/docs registry:smoke

      - name: Run documentation browser tests
        run: pnpm test:docs:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
