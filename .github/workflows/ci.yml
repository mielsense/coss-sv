name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out pinned COSS reference
        uses: actions/checkout@v6
        with:
          repository: cosscom/coss
          ref: 19620ae8cae81e30775f2cde03829326cb4916b2
          path: reference
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check forbidden paths
        run: node scripts/check-forbidden-paths.mjs

      - name: Check license boundary
        run: node scripts/check-license-boundary.mjs

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types and Svelte diagnostics
        run: pnpm check

      - name: Check parity inventory
        run: pnpm parity:check

      - name: Check registry output
        run: pnpm registry:check

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Build packages and documentation
        run: pnpm build

      - name: Smoke-test registry installation
        run: pnpm --filter @coss-sv/docs registry:smoke

      - name: Run documentation browser tests
        run: pnpm test:docs:e2e
